<style>
  html, body { 
    margin: 0; 
    padding: 0; 
    overflow: hidden; 
    background-color: white; 
    width: 100%;
    height: 100%;
  }

  .slider {
    width: 100%;
    height: 120px; 
    overflow: hidden; 
    position: relative;
    background-color: white;
    display: flex;
    align-items: center;
  }

  .slide-track {
    display: flex;
    /* (Largura do slide * Total de logos no HTML) */
    width: calc(300px * 12); 
    animation: scroll 30s linear infinite;
  }

  .slide {
    width: 300px;
    height: 120px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 15px;
    box-sizing: border-box;
    flex-shrink: 0; 
  }

  .slide img {
    max-width: 100%;
    max-height: 80px;
    object-fit: contain;
    filter: grayscale(100%);
    opacity: 0.8;
    transition: 0.5s;
    /* Força a renderização em dispositivos mobile */
    display: block !important;
    border: none;
  }
  
  .slide img:hover { 
    filter: grayscale(0%); 
    opacity: 1; 
  }

  @keyframes scroll {
    0% { transform: translateX(0); }
    /* Desloca metade do track (6 slides de 300px) */
    100% { transform: translateX(calc(-300px * 6)); } 
  }

  /* Ajuste para Mobile - Garante que as imagens apareçam */
  @media (max-width: 768px) {
    .slider { height: 100px; }
    .slide { width: 180px; height: 100px; }
    .slide-track { width: calc(180px * 12); }
    .slide img { max-height: 60px; }
    
    @keyframes scroll {
      0% { transform: translateX(0); }
      100% { transform: translateX(calc(-180px * 6)); }
    }
  }
</style>

</head><body><div class="slider">
  <div class="slide-track">
    <div class="slide"><img src="./01.png" alt="Logo"></div>
    <div class="slide"><img src="./02.png" alt="Logo"></div>

    <div class="slide"><img src="./04.png" alt="Logo"></div>

    <div class="slide"><img src="./01.png" alt="Logo"></div>
    <div class="slide"><img src="./02.png" alt="Logo"></div>
    <div class="slide"><img src="./03.png" alt="Logo"></div>
    <div class="slide"><img src="./04.png" alt="Logo"></div>
    <div class="slide"><img src="./05.png" alt="Logo"></div>
    <div class="slide"><img src="./06.png" alt="Logo"></div>
  </div>
</div></body></html>
