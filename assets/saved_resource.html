<html lang="pt-BR"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"><!--<base href="https://1158694413-atari-embeds.googleusercontent.com/embeds/8ba78a5061a5008d7a0bac8cfaf5dc0c/inner-frame-minified.html?jsh=m%3B%2F_%2Fscs%2Fabc-static%2F_%2Fjs%2Fk%3Dgapi.lb.pt_BR.-OhYyuhHL80.O%2Fd%3D1%2Frs%3DAHpOoo-GfvCq9sFp3IvqHkxnOLwitlGwVg%2Fm%3D__features__" target="_blank">--><base href="." target="_blank">



<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="./css2" rel="stylesheet">

<style>
  /* 1. Reset Global para Iframe */
  html, body {
    height: 100%;
    width: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden; /* Trava barras de rolagem */
    display: flex;
    justify-content: center;
    align-items: center; /* Centralização absoluta vertical/horizontal */
    background-color: transparent; /* Garante que o fundo do site prevaleça */
    -webkit-font-smoothing: antialiased; /* Renderização de fonte nítida */
    -moz-osx-font-smoothing: grayscale;
  }

  /* 2. O Botão */
  .btn-netwo {
    /* Estrutura */
    display: inline-flex;
    justify-content: center;
    align-items: center;
    box-sizing: border-box;
    
    /* Tipografia */
    font-family: 'Outfit', sans-serif;
    font-weight: 500; /* Aumentei levemente o peso para leitura em fundo colorido */
    font-size: 18px;
    text-decoration: none;
    line-height: 1; /* Previne espaços fantasmas acima/abaixo do texto */
    letter-spacing: 0.5px; /* Respira a leitura */
    
    /* Cores e Estilo */
    background-color: #3779bf;
    color: #FFC814;
    border: none;
    border-radius: 50px; /* Arredondamento perfeito (Pill shape) */
    
    /* Dimensões */
    padding: 16px 36px; /* Mais "gordo" para presença visual */
    max-width: 90%; /* Segurança para telas minúsculas */
    
    /* Performance e Animação */
    cursor: pointer;
    transition: all 0.25s cubic-bezier(0.25, 0.46, 0.45, 0.94); /* Curva de animação suave */
    
    /* Sombra Inicial Suave (com tom azulado, não preto puro) */
    box-shadow: 0 4px 15px rgba(55, 121, 191, 0.3);
  }

  /* 3. Estado Hover (Mouse em cima) */
  .btn-netwo:hover {
    background-color: #2b6cb0; /* Azul levemente mais saturado */
    color: #FFD54F; /* Amarelo levemente mais claro para contraste */
    transform: translateY(-2px); /* Elevação sutil */
    box-shadow: 0 8px 25px rgba(55, 121, 191, 0.45); /* Sombra cresce */
  }

  /* 4. Estado Active (Clique) */
  .btn-netwo:active {
    transform: translateY(1px); /* Feedback de "pressionar" */
    box-shadow: 0 2px 10px rgba(55, 121, 191, 0.3); /* Sombra diminui */
  }

  /* 5. Mobile */
  @media (max-width: 480px) {
    .btn-netwo {
      font-size: 16px;
      padding: 14px 28px;
      width: auto;
    }
  }
</style>
</head>
<body>

  <a href="https://sites.google.com/view/netwocomunicacao/cases" target="_top" class="btn-netwo">
    Nossas ideias
  </a>


</body></html>
